projects:
  - title: "\"Third Aarhus Workshop on Strategic Interaction in Corporate Finance\" (PI; granted DKK 80'000)"
    body: |-
      The [Carlsberg Foundation](https://www.carlsbergfondet.dk/en) supports the [Third Aarhus Workshop on Strategic Interaction in Corporate Finance](https://www.dropbox.com/scl/fi/7ji2niorukp0e8v3o7550/Programme-CorpFin-2025.pdf?rlkey=mp6zwhxapxmklhxasedjlm3io&dl=0), Aarhus, August 17-19, 2025.

      **Keynote speakers:**
      - [Simon Gervais](https://scholars.duke.edu/person/simon.gervais) (Duke University)
      - [Ernst Maug](https://www.bwl.uni-mannheim.de/en/about/areas-and-chairs/faculty-profile/maug/) (University of Mannheim)

  - title: "\"Research stay at University of Mannheim\" (PI; granted DKK 190'000)"
    body: |-
      The [Aarhus University Research Foundation](https://auff.au.dk/en/) supports my research stay at University of Mannheim in April-July 2025.

      **Host:** [Alexandra Niessen-Ruenzi](https://www.bwl.uni-mannheim.de/niessen-ruenzi/) (University of Mannheim)

  - title: "\"Second Aarhus Workshop on Strategic Interaction in Corporate Finance\" (PI; granted DKK 66'000)"
    body: |-
      The [Carlsberg Foundation](https://www.carlsbergfondet.dk/en) supports the [Second Aarhus Workshop on Strategic Interaction in Corporate Finance](https://www.dropbox.com/scl/fi/840uoqlh8sewfdl64n7od/Programme-CorpFin-2024.pdf?rlkey=sqgqhtmhnrwf1109o2weyozmz&dl=0), Aarhus, August 18-20, 2024.

      **Keynote speakers:**
      - [Itay Goldstein](https://fnce.wharton.upenn.edu/profile/itayg/) (Wharton School, University of Pennsylvania)
      - [Mike Burkart](https://www.lse.ac.uk/finance/people/faculty/Burkart) (London School of Economics)

  - title: "\"Debt valuation and strategic interaction\" (PI; granted DKK 2,847,650)"
    body: |-
      **International partners:** [Christian Hilpert](http://www.christianhilpert.de/) (Deakin University) and [Alexander Szimayer](https://www.wiso.uni-hamburg.de/en/fachbereich-sozoek/professuren/szimayer/team/szimayer-alexander.html) (Hamburg University)

      **Expert panel:**
      - [Christopher Hennessy](https://www.london.edu/faculty-and-research/faculty-profiles/h/hennessy-c) (London Business School)
      - [David Lando](https://www.cbs.dk/en/research/departments-and-centres/department-of-finance/staff/dlfi) (Copenhagen Business School)
      - [Andrey Malenko](https://www.amalenko.com/) (Boston College)
      - [Marliese Uhrig-Homburg](https://derivate.fbv.kit.edu/english/Current-Team_Uhrig-Homburg.php) (Karlsruhe Institute of Technology)

      **Partly funded by project:** [Matthias Lassak](https://sites.google.com/view/matthiaslassak) (Aarhus University)

      **Duration:** 01/01/2021 → 31/12/2024
      **Funded by** The Independent Research Fund Denmark

      **Project workshop:** [Aarhus Workshop on Strategic Interaction in Corporate Finance](https://www.dropbox.com/scl/fi/ommfaybh55kkx6jv7jsl6/Programme-CorpFin-2023.pdf?rlkey=p0p641a7vm9ter1ng1j9f50ba&dl=0), Aarhus, August 14-15, 2023

      **Output:**
      - "[The Information Value of Distress](https://doi.org/10.1287/mnsc.2022.4632)" (Management Science 2024)
      - "[Managerial Overoptimism and Discretionary Disclosure](https://onlinelibrary.wiley.com/doi/10.1111/jbfa.70059)" (Journal of Business Finance & Accounting 2026)
      - "[Information sharing with blockchain](https://doi.org/10.1016/j.respol.2026.105496)" (Research Policy 2026)
      - "[Financial Flexibility and Debt Maturity Concentration](https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5170117)" (WP)
      - "[Efficiency Implications of Knowledge Generation: Private Versus Public Firms](https://ssrn.com/abstract=5030469)" (WP)
      - "[Credit Rating under Ambiguity](https://ssrn.com/abstract=4564357)" (WP)
      - "[Bankruptcy Prediction with Incomplete Accounting Information](https://ssrn.com/abstract=4280446)" (WP)
      - "[Clustered IPOs as a Commitment Device](https://ssrn.com/abstract=3556578)" (WP)
      - "[Strategic Nondisclosure and Market Feedback](https://ssrn.com/abstract=4040976)" (WP)
      - "[Voluntary Disclosure, Price Informativeness, and Efficient Investment](https://ssrn.com/abstract=3556575)" (WP)

      [Link to IRFD record](https://dff.dk/en/grants?SearchableText=hirth&period%3Alist=all&instrument%3Alist=all&filed_method%3Alist=all)

  - title: "\"The Firm's Life Cycle -- Investment and Financing Decisions\""
    body: |-
      Joint with [Christian Riis Flor](https://sites.google.com/site/florfinance/Home) (PI) and [Alexander Schandlbauer](https://sites.google.com/site/alexanderschandlbauer/) (both SDU)

      **International partner:** [Evgeny Lyandres](https://en-coller.tau.ac.il/profile/lyandres) (Tel Aviv University)

      **Duration:** 01/01/2019 → 30/09/2021
      **Funded by** Danish Agency for Science and Higher Education (International Network Programme)

      [Link to SDU record](https://portal.findresearcher.sdu.dk/en/projects/the-firms-life-cycle-investment-and-financing-decisions)

  - title: "\"The Credit Ratings Game - revisited\" (PI; granted EUR 10,000)"
    body: |-
      Funded by [Europlace Institute of Finance](https://www.institutlouisbachelier.org/en/ilb-dna/the-foundations/), 2011

      **Output:**
      - "[Credit Rating Dynamics and Competition](https://doi.org/10.1016/j.jbankfin.2014.08.011)" (Journal of Banking & Finance 2014)
